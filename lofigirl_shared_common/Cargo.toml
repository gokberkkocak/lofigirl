[package]
name = "lofigirl_shared_common"
version = "0.3.0"
authors = ["Gokberk Kocak <gokberkkocak@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }

aes-gcm = { version = "0.11", features = ["getrandom"] }
anyhow = "1.0"
base64 = "0.23"
strsim = "0.11"
thiserror = "2.0"
tracing = "0.1"
typenum = "1.20"
jwt-compact = "0.8"
chrono = "0.4"
